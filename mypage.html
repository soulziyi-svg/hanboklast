<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마이페이지 | 연화재실</title>
  <link rel="stylesheet" href="css/style.css?v=20260828-goods-spacing">
  <link rel="stylesheet" href="css/mypage.css?v=20260827-review-file-button">
</head>
<body>
  <header class="my-header"><a href="index.html">← 쇼핑 계속하기</a><img src="img/logo.png" alt="연화재실"><button id="logoutBtn">로그아웃</button></header>
  <main class="mypage">
    <section class="my-hero"><p>MY PAGE</p><h1 id="myGreeting">나의 연화재실</h1><p>주문부터 후기와 문의까지 한곳에서 관리하세요.</p></section>
    <nav class="my-tabs" aria-label="마이페이지 메뉴">
      <button class="is-active" data-tab="orders">구매한 상품</button><button data-tab="claims">취소·교환·반품</button><button data-tab="coupons">쿠폰 관리</button><button data-tab="viewed">내가 본 상품</button><button data-tab="inquiry">1:1 문의하기</button>
    </nav>
    <section id="orders" class="my-panel is-active"><h2>구매한 상품</h2><div id="orderList" class="my-list"></div></section>
    <section id="claims" class="my-panel"><h2>취소·교환·반품</h2><div id="claimList" class="my-list"></div></section>
    <section id="coupons" class="my-panel"><h2>쿠폰 관리</h2><div id="couponList" class="my-list"></div></section>
    <section id="viewed" class="my-panel"><h2>내가 본 상품</h2><div id="viewedList" class="viewed-grid"></div></section>
    <section id="inquiry" class="my-panel"><h2>1:1 문의하기</h2><form id="inquiryForm" class="my-form"><select id="inquiryType"><option>상품 문의</option><option>배송 문의</option><option>취소·교환·반품</option><option>기타</option></select><input id="inquiryTitle" placeholder="문의 제목" required><textarea id="inquiryContent" placeholder="문의 내용을 입력해주세요" required></textarea><button>문의 등록</button></form></section>
  </main>
  <div id="reviewModal" class="modal-overlay" hidden>
    <form id="reviewForm" class="modal review-modal">
      <button type="button" class="modal-close" data-close="reviewModal">닫기 ✕</button>
      <div class="review-upload">
        <h3>사진·영상 첨부</h3>
        <button type="button" id="reviewDropzone" class="review-dropzone"><span>＋</span><b>이미지 또는 영상 선택</b><small>클릭하거나 파일을 끌어 놓으세요 · 최대 5개 · 파일당 20MB</small></button>
        <input type="file" id="reviewFiles" class="review-file-input" accept="image/*,video/*" multiple>
        <div id="reviewPreview" class="review-preview"><p>첨부한 파일이 여기에 표시됩니다.</p></div>
      </div>
      <div class="review-fields my-form">
        <h3>구매 후기 작성</h3>
        <input type="hidden" id="reviewProductId"><input type="hidden" id="reviewOrderItemId">
        <label>별점<select id="reviewRating"><option value="5">★★★★★ 5점</option><option value="4">★★★★☆ 4점</option><option value="3">★★★☆☆ 3점</option><option value="2">★★☆☆☆ 2점</option><option value="1">★☆☆☆☆ 1점</option></select></label>
        <textarea id="reviewContent" placeholder="상품 후기를 남겨주세요" required></textarea>
        <button type="submit" id="reviewSubmitBtn">후기 등록</button>
      </div>
    </form>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/supabase-client.js"></script><script src="js/shop-common.js?v=20260828-review-fix"></script><script src="js/mypage.js?v=20260828-no-confirm-review"></script>
</body></html>
