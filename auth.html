<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>로그인·회원가입 | 연화재실</title>
<link rel="preconnect" href="https://fastly.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css?v=20260828-selected-checkout">
<link rel="stylesheet" href="css/auth.css?v=20260828-scroll-top">
</head>
<body class="auth-page">
  <div class="auth-visual auth-visual--left" aria-hidden="true"></div>
  <div class="auth-visual auth-visual--right" aria-hidden="true"></div>
  <main class="auth-window">
    <a class="auth-window__logo" href="index.html" aria-label="연화재실 홈"><img src="img/logo-red.png?v=20260827" alt="연화재실"></a>
    <p class="auth-window__eyebrow">YEONHWAJAESIL MEMBER</p>
    <div class="auth-window__tabs" role="tablist">
      <button id="authLoginTab" type="button" data-auth-tab="login">로그인</button>
      <button id="authSignupTab" type="button" data-auth-tab="signup">회원가입</button>
      <button id="authFindIdTab" type="button" data-auth-tab="find-id">아이디 찾기</button>
    </div>

    <section id="authLoginPanel" class="auth-window__panel">
      <h1>다시 만나 반갑습니다.</h1>
      <p>로그인 후 쿠폰, 주문 내역과 구매 후기를 확인할 수 있습니다.</p>
      <div class="auth-window__test-account">
        <strong>테스트용 아이디 / 비밀번호</strong>
        <span><b>test</b> / <b>1234</b></span>
        <small>일반회원 기능을 자유롭게 확인할 수 있습니다.</small>
      </div>
      <form id="pageLoginForm" class="auth-window__form">
        <label>아이디 또는 이메일<input type="text" id="pageLoginEmail" autocomplete="username" required></label>
        <label>비밀번호<input type="password" id="pageLoginPassword" autocomplete="current-password" required></label>
        <button type="submit">로그인하기</button>
      </form>
      <button class="auth-window__switch" type="button" data-go-auth="signup">아직 회원이 아니신가요? 회원가입</button>
    </section>

    <section id="authSignupPanel" class="auth-window__panel" hidden>
      <h1>연화재실의 회원이 되어보세요.</h1>
      <p>가입이 완료되면 첫 구매에 사용할 수 있는 10% 쿠폰을 드립니다.</p>
      <div class="auth-window__terms">
        <label><input type="checkbox" id="pageAgreeAll"> 모든 약관에 동의합니다.</label>
        <label><input type="checkbox" class="page-agree-item"> 서비스 통합이용약관 동의 <b>(필수)</b></label>
        <label><input type="checkbox" class="page-agree-item"> 위치정보 수집 및 이용 동의</label>
      </div>
      <form id="pageSignupForm" class="auth-window__form">
        <label>이름<input type="text" id="pageSignupName" autocomplete="name" required></label>
        <label>연락처<input type="tel" id="pageSignupPhone" autocomplete="tel" placeholder="010-0000-0000" required></label>
        <label>이메일<input type="email" id="pageSignupEmail" autocomplete="email" required></label>
        <label>비밀번호<input type="password" id="pageSignupPassword" minlength="6" autocomplete="new-password" required></label>
        <label>비밀번호 확인<input type="password" id="pageSignupPasswordConfirm" minlength="6" autocomplete="new-password" required></label>
        <label>기본주소 <small>(선택)</small><input type="text" id="pageSignupAddress" autocomplete="street-address"></label>
        <button type="submit" id="pageSignupSubmit" disabled>동의하고 가입하기</button>
      </form>
      <button class="auth-window__switch" type="button" data-go-auth="login">이미 회원이신가요? 로그인</button>
    </section>

    <section id="authFindIdPanel" class="auth-window__panel" hidden>
      <h1>가입한 아이디를 찾아보세요.</h1>
      <p>회원가입 또는 주문 시 등록한 이름과 연락처를 입력해주세요.</p>
      <form id="pageFindIdForm" class="auth-window__form">
        <label>이름<input type="text" id="pageFindIdName" autocomplete="name" required></label>
        <label>연락처<input type="tel" id="pageFindIdPhone" autocomplete="tel" placeholder="010-0000-0000" required></label>
        <button type="submit">아이디 찾기</button>
      </form>
      <div id="findIdResult" class="auth-window__result" hidden></div>
      <button class="auth-window__switch" type="button" data-go-auth="login">로그인 화면으로 돌아가기</button>
    </section>
    <p id="authPageMessage" class="auth-window__message" aria-live="polite"></p>
    <a class="auth-window__back" href="index.html">← 사이트로 돌아가기</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js?v=20260828-test-account"></script>
</body>
</html>
